name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  bundle-size:
    runs-on: ubuntu-latest
    env:
      MAX_GZIP_BYTES: 327680
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx wrangler deploy --dry-run --outdir dist
      - run: |
          size=$(gzip -9c dist/index.js | wc -c)
          echo "worker bundle gzip: $size bytes (limit $MAX_GZIP_BYTES)"
          test "$size" -le "$MAX_GZIP_BYTES"
